name: 'Critical CSS'
description: 'Generate Critical CSS'
inputs:
  serverBaseUrl:
    description: 'The base url of the site'
    required: true
  destinationPath:
    description: 'The destination path to store the generated files'
    required: false
    default: './criticalcss/'
  configPath:
    description: 'Path to config file'
    required: true
  sync:
    description: 'Should the generated files be synced to the remote server'
    required: false
    default: 'true'
  sshPrivateKey:
    description: 'Private SSH KEY'
    required: false
    default: ''
  sshHost:
    description: 'The host to connect to in user@host format'
    required: false
  sshPort:
    description: 'The ssh port in string format'
    required: false
    default: '22'
  knownHosts:
    description: 'known_hosts entries for the remote host; when set, the host key is verified'
    required: false
    default: ''
  targetDir:
    description: 'Remote directory to sync the generated files to (required when sync is true)'
    required: false
  dimensions:
    description: 'Comma separated viewports (WIDTHxHEIGHT) that define the fold'
    required: false
    default: '375x667,1440x1280'
  concurrency:
    description: 'Number of pages to generate at the same time'
    required: false
    default: '2'

runs:
  using: docker
  image: ghcr.io/appmanschap/critical-css-action:v3.0.0
  env:
    INPUT_SERVERBASEURL: ${{inputs.serverBaseUrl}}
    INPUT_DESTINATIONPATH: ${{inputs.destinationPath}}
    INPUT_CONFIGPATH: ${{inputs.configPath}}
    INPUT_SYNC: ${{inputs.sync}}
    INPUT_SSHPRIVATEKEY: ${{inputs.sshPrivateKey}}
    INPUT_SSHHOST: ${{inputs.sshHost}}
    INPUT_SSHPORT: ${{inputs.sshPort}}
    INPUT_KNOWNHOSTS: ${{inputs.knownHosts}}
    INPUT_TARGETDIR: ${{inputs.targetDir}}
    INPUT_DIMENSIONS: ${{inputs.dimensions}}
    INPUT_CONCURRENCY: ${{inputs.concurrency}}
branding:
  icon: 'package'
  color: 'gray-dark'
